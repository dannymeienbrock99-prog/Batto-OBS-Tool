<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Batto OBS Tool – Twitch-Hologramm-Editor</title>
    <link rel="stylesheet" href="./editor.css">
  </head>
  <body>
    <main class="editor-shell">
      <section class="editor-controls">
        <header>
          <span class="eyebrow">Batto OBS Tool</span>
          <h1>Twitch-Hologramm</h1>
          <p>
            Eigener kostenloser Effekt für Twitch-Namen und Chatnachrichten – ohne Discord,
            Server-Boost oder Bezahlsperre.
          </p>
        </header>

        <section class="control-section">
          <h2>Wo soll der Effekt erscheinen?</h2>
          <label class="check-row"><input id="effect-enabled" type="checkbox" checked> Hologramm-Effekt aktiv</label>
          <label class="check-row"><input id="effect-name" type="checkbox" checked> Twitch-Name holografisch</label>
          <label class="check-row"><input id="effect-message" type="checkbox" checked> Chatnachricht holografisch</label>
          <label class="check-row"><input id="transparent-bubbles" type="checkbox"> Nur Schrift, keine Sprechblase</label>
          <label class="check-row"><input id="reduced-motion" type="checkbox"> Weniger Animation</label>
        </section>

        <section class="control-section">
          <h2>Wem wird der Stil zugewiesen?</h2>
          <label>Rolle
            <select id="style-target">
              <option value="broadcaster">Streamer</option>
              <option value="moderator">Moderator</option>
              <option value="vip">VIP</option>
              <option value="subscriber">Abonnent</option>
              <option value="viewer">Zuschauer</option>
              <option value="user">Bestimmter Twitch-Name</option>
            </select>
          </label>
          <label id="user-name-row" hidden>Twitch-Name
            <input id="user-name" type="text" maxlength="80" placeholder="z. B. crazy_batto" autocomplete="off">
          </label>
        </section>

        <section class="control-section">
          <h2>Hologramm-Farben</h2>
          <div class="color-grid">
            <label>Farbe 1<input id="color-1" type="color" value="#54f4ff"></label>
            <label>Farbe 2<input id="color-2" type="color" value="#9867ff"></label>
            <label>Farbe 3<input id="color-3" type="color" value="#ff55c8"></label>
            <label>Farbe 4<input id="color-4" type="color" value="#ffe66d"></label>
            <label>Farbe 5<input id="color-5" type="color" value="#54f4ff"></label>
            <label>Farbe 6<input id="color-6" type="color" value="#9867ff"></label>
          </div>
          <label>Aktive Farben
            <select id="color-count">
              <option value="2">2 Farben</option>
              <option value="3">3 Farben</option>
              <option value="4" selected>4 Farben</option>
              <option value="5">5 Farben</option>
              <option value="6">6 Farben</option>
            </select>
          </label>
          <label>Farbwinkel
            <span class="range-row">
              <input id="angle" type="range" min="0" max="360" step="1" value="110">
              <output id="angle-value">110°</output>
            </span>
          </label>
          <label>Animationsgeschwindigkeit
            <span class="range-row">
              <input id="speed" type="range" min="0.6" max="15" step="0.1" value="4.5">
              <output id="speed-value">4,5 s</output>
            </span>
          </label>
          <label>Leuchtstärke
            <span class="range-row">
              <input id="glow" type="range" min="0" max="50" step="1" value="18">
              <output id="glow-value">18 px</output>
            </span>
          </label>
          <label>Helligkeit
            <span class="range-row">
              <input id="brightness" type="range" min="0.5" max="2" step="0.05" value="1.15">
              <output id="brightness-value">115 %</output>
            </span>
          </label>
          <label>Sättigung
            <span class="range-row">
              <input id="saturation" type="range" min="0" max="3" step="0.05" value="1.2">
              <output id="saturation-value">120 %</output>
            </span>
          </label>
        </section>

        <section class="control-section">
          <h2>Vorlagen</h2>
          <div class="button-row">
            <button type="button" data-preset="discord-like">Hologramm</button>
            <button type="button" data-preset="cyan-purple">Cyan–Lila</button>
            <button type="button" data-preset="gold">Gold</button>
            <button type="button" data-preset="red-gold">Rot–Gold</button>
            <button type="button" data-preset="green-cyan">Grün–Cyan</button>
          </div>
        </section>

        <section class="control-section">
          <h2>Speichern</h2>
          <div class="button-row">
            <button id="save-style" class="primary" type="button">Stil übernehmen</button>
            <button id="remove-user-style" class="danger" type="button" hidden>Benutzerstil entfernen</button>
            <button id="export-config" type="button">Konfiguration kopieren</button>
          </div>
          <output id="editor-status" class="status" aria-live="polite"></output>
        </section>
      </section>

      <section class="editor-preview">
        <header class="preview-toolbar">
          <strong>Live-Vorschau</strong>
          <div class="button-row">
            <button id="preview-streamer" type="button">Streamer testen</button>
            <button id="preview-mod" type="button">Moderator testen</button>
            <button id="preview-viewer" type="button">Zuschauer testen</button>
            <button id="preview-clear" type="button">Leeren</button>
          </div>
        </header>
        <iframe
          id="preview-frame"
          class="preview-frame"
          src="./overlay.html"
          title="Vorschau des Twitch-Hologramm-Chats"
          sandbox="allow-scripts allow-same-origin"
        ></iframe>
      </section>
    </main>
    <script src="./editor.js"></script>
  </body>
</html>
