name: Batto OBS Tool 2.0.0 Windows Release

on:
  push:
    branches:
      - release/windows-2.0.0-integrated
    paths:
      - "desktop/**"
      - ".github/workflows/windows-release-2.0.0.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batto-obs-tool-2.0.0-windows
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install --no-audit --no-fund --ignore-scripts=false
          if ($LASTEXITCODE -ne 0) { throw "npm install ist fehlgeschlagen." }

      - name: Prepare complete V4 application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run prepare:integrated
          if ($LASTEXITCODE -ne 0) { throw "V4-Produktionsquelle konnte nicht vorbereitet werden." }

      - name: Validate complete V4 source and required artwork
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "V4-Produktionsprüfung ist fehlgeschlagen." }

      - name: Run complete V4 Multi Chat moderation Chat Bot and module tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --test test/integrated-2.0.0.test.cjs test/v4-phase1.test.cjs test/v4-completion.test.cjs test/store.test.cjs test/multi-chat.test.cjs test/chat-bot.test.cjs modules/twitch-holo-chat/test/*.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Mindestens ein V4-Test ist fehlgeschlagen." }

      - name: Build Windows x64 NSIS installer with required desktop icon
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $ErrorActionPreference = "Stop"
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw "Windows-Installer konnte nicht gebaut werden." }
          $installer = Get-ChildItem "dist" -Filter "Batto-OBS-Tool-Setup-2.0.0.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Batto-OBS-Tool-Setup-2.0.0.exe fehlt." }
          if (-not (Test-Path "resources/desktop-icon.jpg")) { throw "Geliefertes Desktop-Icon wurde nicht für den Build erzeugt." }
          if (-not (Test-Path "src/renderer/assets/HIntergund.png")) { throw "V4-Programm-Hintergrund wurde nicht erzeugt." }
          if (Test-Path "src/services/hardware.cjs") { throw "Entfernte Hardware-Vollanalyse ist wieder vorhanden." }
          if (Test-Path "modules/encoder-monitoring-overlay") { throw "Entferntes Encoder-Monitoring ist wieder vorhanden." }

      - name: Package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $PWD "release-2.0.0"
          Remove-Item -Recurse -Force $releaseDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          $installer = Get-ChildItem "dist" -Filter "Batto-OBS-Tool-Setup-2.0.0.exe" -File | Select-Object -First 1
          Copy-Item $installer.FullName (Join-Path $releaseDir $installer.Name)
          $hash = Get-FileHash (Join-Path $releaseDir $installer.Name) -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $($installer.Name)" | Set-Content -Encoding ASCII (Join-Path $releaseDir "SHA256.txt")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Batto-OBS-Tool-2.0.0-Windows
          path: |
            desktop/release-2.0.0/Batto-OBS-Tool-Setup-2.0.0.exe
            desktop/release-2.0.0/SHA256.txt
          if-no-files-found: error
