name: Batto OBS Tool 1.9.0 Windows Release v2

on:
  push:
    branches:
      - release/windows-1.9.0-final
    paths:
      - "desktop/**"
      - "modules/**"
      - ".github/workflows/windows-release-1.9.0-v2.yml"
      - ".github/release-1.9.0-v2-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batto-obs-tool-1.9.0-windows-v2
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Copy integrated production modules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force "desktop/modules" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "desktop/modules" | Out-Null
          Copy-Item -Recurse -Force "modules/encoder-monitoring-overlay" "desktop/modules/encoder-monitoring-overlay"
          Copy-Item -Recurse -Force "modules/twitch-holo-chat" "desktop/modules/twitch-holo-chat"
          if (-not (Test-Path "desktop/modules/encoder-monitoring-overlay/src/server.cjs")) { throw "Monitoring-Modul fehlt." }
          if (-not (Test-Path "desktop/modules/twitch-holo-chat/web/overlay.html")) { throw "Twitch-Hologramm-Modul fehlt." }

      - name: Install dependencies
        working-directory: desktop
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Prepare final non-demo application
        working-directory: desktop
        shell: pwsh
        run: |
          node scripts/prepare-modules.cjs
          node scripts/prepare-production.cjs
          node scripts/prepare-release-hotfix.cjs

      - name: Run unit and production tests
        working-directory: desktop
        shell: pwsh
        run: npm test

      - name: Build Windows x64 NSIS installer
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Self-test unpacked application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem "desktop/dist/win-unpacked" -Filter "Batto OBS Tool.exe" -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Ungepackte Anwendung fehlt." }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Self-Test fehlgeschlagen: $($process.ExitCode)" }

      - name: Silent installer test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "desktop/dist" -Filter "Batto-OBS-Tool-Setup-1.9.0.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS-Installer fehlt." }
          $bytes = [IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Ungültiger PE-Header." }
          $installDir = Join-Path $env:RUNNER_TEMP "BattoObsTool-1.9.0-Test"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installation fehlgeschlagen: $($install.ExitCode)" }
          $installedExe = Join-Path $installDir "Batto OBS Tool.exe"
          if (-not (Test-Path $installedExe)) { throw "Installierte EXE fehlt." }
          $selfTest = Start-Process -FilePath $installedExe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($selfTest.ExitCode -ne 0) { throw "Self-Test der Installation fehlgeschlagen: $($selfTest.ExitCode)" }

      - name: Package verified release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path $PWD "release-1.9.0"
          Remove-Item -Recurse -Force $release -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $release | Out-Null
          $installer = Get-ChildItem "desktop/dist" -Filter "Batto-OBS-Tool-Setup-1.9.0.exe" -File | Select-Object -First 1
          Copy-Item $installer.FullName (Join-Path $release $installer.Name)
          @"
          BATTO OBS TOOL 1.9.0 – INSTALLATION

          1. Batto-OBS-Tool-Setup-1.9.0.exe starten.
          2. Im Installer den Installationsordner beziehungsweise das Laufwerk auswählen.
          3. Nach der Installation Batto OBS Tool starten und zuerst die Hardwarediagnose ausführen.
          4. OBS WebSocket unter Werkzeuge > WebSocket-Servereinstellungen aktivieren.
          5. Standard: 127.0.0.1:4455.

          Enthalten: Windows-Hardwarediagnose, Internettest, OBS-Verbindung, Encoder-Empfehlung,
          bestätigungspflichtige Belastungstests, transparentes Monitoring, Twitch-Hologramm und Touch-Deck.
          Keine Demo-Version.
          "@ | Set-Content -Encoding UTF8 (Join-Path $release "INSTALLATION.txt")
          $hash = Get-FileHash (Join-Path $release $installer.Name) -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer.Name)" | Set-Content -Encoding ASCII (Join-Path $release "SHA256.txt")
          $zip = Join-Path $PWD "Batto-OBS-Tool-1.9.0-Windows.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path "$release/*" -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            if ($entries -notcontains "Batto-OBS-Tool-Setup-1.9.0.exe") { throw "Installer fehlt im ZIP." }
            if ($entries -notcontains "SHA256.txt") { throw "Prüfsumme fehlt im ZIP." }
          } finally { $archive.Dispose() }

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Batto-OBS-Tool-1.9.0-Windows-v2
          path: |
            Batto-OBS-Tool-1.9.0-Windows.zip
            release-1.9.0/Batto-OBS-Tool-Setup-1.9.0.exe
            release-1.9.0/SHA256.txt
            release-1.9.0/INSTALLATION.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish public GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release delete v1.9.0 --cleanup-tag --yes 2>$null
          gh release create v1.9.0 `
            "Batto-OBS-Tool-1.9.0-Windows.zip" `
            "release-1.9.0/Batto-OBS-Tool-Setup-1.9.0.exe" `
            "release-1.9.0/SHA256.txt" `
            "release-1.9.0/INSTALLATION.txt" `
            --target "$env:GITHUB_SHA" `
            --title "Batto OBS Tool 1.9.0" `
            --notes "Vollständige Windows-x64-Version. Der NSIS-Installer wurde gebaut, still installiert und die installierte Anwendung per Self-Test geprüft. Enthalten sind Hardwarediagnose, OBS-Optimierung, transparentes Monitoring, Twitch-Hologrammfarben und Touch-Deck."
