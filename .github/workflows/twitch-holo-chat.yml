name: Twitch Hologramm-Chat

on:
  push:
    branches:
      - feat/twitch-holo-chat
    paths:
      - "modules/twitch-holo-chat/**"
      - ".github/workflows/twitch-holo-chat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twitch-holo-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/twitch-holo-chat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: JavaScript syntax check
        run: npm run check

      - name: Unit tests
        run: npm test
