name: Batto OBS Tool 2.0.0 Final Verification

on:
  push:
    branches:
      - release/windows-2.0.0-integrated
    paths:
      - ".github/workflows/windows-release-2.0.0-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batto-obs-tool-2.0.0-final
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout integrated release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build, test, install, launch, verify modules and uninstall
        working-directory: desktop
        shell: pwsh
        run: ./scripts/ci-release-2.0.0.ps1

      - name: Upload verified Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Batto-OBS-Tool-2.0.0-Windows
          path: |
            desktop/Batto-OBS-Tool-2.0.0-Windows.zip
            desktop/release-2.0.0/Batto-OBS-Tool-Setup-2.0.0.exe
            desktop/release-2.0.0/INSTALLATION.txt
            desktop/release-2.0.0/SHA256.txt
            desktop/release-2.0.0/BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish public GitHub release
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view v2.0.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v2.0.0 --cleanup-tag --yes
          }
          gh release create v2.0.0 `
            "Batto-OBS-Tool-2.0.0-Windows.zip" `
            "release-2.0.0/Batto-OBS-Tool-Setup-2.0.0.exe" `
            "release-2.0.0/SHA256.txt" `
            "release-2.0.0/INSTALLATION.txt" `
            "release-2.0.0/BUILD-REPORT.txt" `
            --target "$env:GITHUB_SHA" `
            --title "Batto OBS Tool 2.0.0" `
            --notes "Vollständig integrierter Windows-x64-Release mit einer Hauptanwendung und einem NSIS-Installer. Enthält Hardwarediagnose, OBS und Encoder-Empfehlung, bestätigungspflichtige Tests, das erhaltene neue Monitoring, Stream-Overlay mit Team-Alpha-Logo, Twitch-Hologramm, Multi-Chat, OBS-Gäste, Touch-Deck, Plugin-Kompatibilität, lokale Handy-Kopplung und sichere Alt-Datenmigration. Der Build wurde installiert, normal gestartet, auf alle lokalen Dienste und genau eine Hauptinstanz geprüft und anschließend wieder deinstalliert."
