name: Publish Batto OBS Tool 1.9.1

on:
  push:
    branches:
      - release/windows-1.9.1-hotfix
    paths:
      - ".github/workflows/publish-windows-1.9.1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-batto-obs-tool-1.9.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download the successfully tested Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Batto-OBS-Tool-1.9.1-Windows
          path: verified
          repository: dannymeienbrock99-prog/Batto-OBS-Tool
          run-id: 31953431484
          github-token: ${{ github.token }}

      - name: Revalidate downloaded package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem verified -Filter "Batto-OBS-Tool-1.9.1-Windows.zip" -File -Recurse | Select-Object -First 1
          $installer = Get-ChildItem verified -Filter "Batto-OBS-Tool-Setup-1.9.1.exe" -File -Recurse | Select-Object -First 1
          $shaFile = Get-ChildItem verified -Filter "SHA256.txt" -File -Recurse | Select-Object -First 1
          $instructions = Get-ChildItem verified -Filter "INSTALLATION.txt" -File -Recurse | Select-Object -First 1
          if (-not $zip -or -not $installer -or -not $shaFile -or -not $instructions) { throw "Der geprüfte Release ist unvollständig." }
          $bytes = [IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Installer besitzt keinen gültigen PE-Header." }
          $declared = ((Get-Content $shaFile.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($declared -ne $actual) { throw "SHA-256 des Installers stimmt nicht überein." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            if ($entries -notcontains "Batto-OBS-Tool-Setup-1.9.1.exe") { throw "Installer fehlt im ZIP." }
            if ($entries -notcontains "SHA256.txt") { throw "Prüfsumme fehlt im ZIP." }
            if ($entries -notcontains "INSTALLATION.txt") { throw "Installationshinweise fehlen im ZIP." }
          } finally { $archive.Dispose() }
          "RELEASE_ZIP=$($zip.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_INSTALLER=$($installer.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_SHA=$($shaFile.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_INSTRUCTIONS=$($instructions.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish public GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view v1.9.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v1.9.1 --cleanup-tag --yes
          }
          gh release create v1.9.1 `
            "$env:RELEASE_ZIP" `
            "$env:RELEASE_INSTALLER" `
            "$env:RELEASE_SHA" `
            "$env:RELEASE_INSTRUCTIONS" `
            --target release/windows-1.9.1-hotfix `
            --title "Batto OBS Tool 1.9.1" `
            --notes "Reparierter Windows-x64-Release. Ein NSIS-Installer und eine Hauptanwendung. Der geprüfte Build wurde still installiert, per Self-Test gestartet und auf genau eine Hauptinstanz geprüft. Enthalten sind lokale Hardwarediagnose, OBS-WebSocket-Verbindung, Encoder-Empfehlung, bestätigungspflichtige Belastungstests, transparentes Monitoring und Twitch-Hologramm. Keine Demo-Version und keine separate Creator-Hub-EXE."
