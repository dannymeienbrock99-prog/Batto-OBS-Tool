name: Batto OBS Tool Windows Package

on:
  push:
    branches:
      - main
      - feat/touch-deck-pro-plugin-sidebar
    paths:
      - "desktop/**"
      - ".github/workflows/touch-deck-pro-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/touch-deck-pro-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batto-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          npm install --no-audit --no-fund --ignore-scripts=false
          if ($LASTEXITCODE -ne 0) { throw "npm install ist fehlgeschlagen." }

      - name: Assemble and test Batto OBS Tool
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Batto-OBS-Tool Integrationstests sind fehlgeschlagen." }
          foreach ($required in @(
            "src/renderer/touch-deck-classic.js",
            "src/renderer/touch-deck-classic.css",
            "src/renderer/index.html",
            "src/services/platforms/twitch-adapter.cjs",
            "src/services/platforms/tiktok-adapter.cjs",
            "src/stream-overlay/overlay.js"
          )) {
            if (-not (Test-Path $required)) { throw "Vorbereitete Produktionsdatei fehlt: $required" }
          }
          $index = Get-Content "src/renderer/index.html" -Raw
          if ($index -notmatch 'touch-deck-classic\.css') { throw "Classic-Touch-Deck-CSS ist nicht eingebunden." }
          if ($index -notmatch 'touch-deck-classic\.js') { throw "Classic-Touch-Deck-JavaScript ist nicht eingebunden." }
          if ($index -match 'touch-deck-pro-v2') { throw "Touch-Deck Pro ist noch im veröffentlichten Hauptfenster eingebunden." }

      - name: Build Windows x64 application installer
        shell: pwsh
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          npm_config_ignore_scripts: "false"
        run: |
          $ErrorActionPreference = "Stop"
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw "Windows-Installer konnte nicht gebaut werden." }
          $installer = Get-ChildItem "dist" -Filter "Batto-OBS-Tool-Setup-2.0.0.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Batto-OBS-Tool-Setup-2.0.0.exe fehlt." }
          $unpacked = Resolve-Path "dist/win-unpacked"
          $exe = Get-ChildItem $unpacked -Filter "Batto OBS Tool.exe" -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Ungepackte Hauptanwendung fehlt." }
          $selfTest = Start-Process -FilePath $exe.FullName -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($selfTest.ExitCode -ne 0) { throw "Self-Test fehlgeschlagen: $($selfTest.ExitCode)" }

      - name: Package application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path $PWD "release-batto-obs-tool"
          Remove-Item -Recurse -Force $release -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $release | Out-Null

          $installer = Get-ChildItem "desktop/dist" -Filter "Batto-OBS-Tool-Setup-2.0.0.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Batto-OBS-Tool-Setup-2.0.0.exe fehlt." }
          Copy-Item $installer.FullName (Join-Path $release $installer.Name)

          @"
          BATTO OBS TOOL 2.0.0 – WINDOWS-PAKET

          1. Batto-OBS-Tool-Setup-2.0.0.exe installieren.

          Enthalten:
          - klassisches profilbasiertes Touch-Deck aus dem früheren Setup
          - Twitch Chat anonym/read-only ohne OAuth-Token
          - TikTok LIVE Connector mit stabiler Initialisierung
          - Stream-Overlay mit wirksamer Hoch-/Querformat-Ausrichtung
          - OBS Co-Host/Gäste über echte Scene-Item-Schaltung
          - Multi-Chat, Plugins, Piper TTS und lokale Handy-Steuerung
          "@ | Set-Content -Encoding UTF8 (Join-Path $release "INSTALLATION.txt")

          $hashLines = Get-ChildItem $release -File -Recurse | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            $relative = [IO.Path]::GetRelativePath($release, $_.FullName)
            "$($hash.Hash.ToLowerInvariant())  $relative"
          }
          $hashLines | Set-Content -Encoding ASCII (Join-Path $release "SHA256.txt")

          $zip = Join-Path $PWD "Batto-OBS-Tool-2.0.0-Windows.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$release/*" -DestinationPath $zip -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @(
              "Batto-OBS-Tool-Setup-2.0.0.exe",
              "INSTALLATION.txt",
              "SHA256.txt"
            )) {
              if ($entries -notcontains $required) { throw "Paket-ZIP ist unvollständig: $required fehlt." }
            }
          } finally { $archive.Dispose() }

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Batto-OBS-Tool-2.0.0-Windows
          path: Batto-OBS-Tool-2.0.0-Windows.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
