name: Batto OBS Tool Touch-Deck Pro Windows Package (legacy)

on:
  push:
    branches:
      - feat/touch-deck-pro-plugin-sidebar
    paths:
      - "desktop/**"
      - ".github/workflows/touch-deck-pro-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batto-touch-deck-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    if: github.ref_name == 'feat/touch-deck-pro-plugin-sidebar' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          npm install --no-audit --no-fund --ignore-scripts=false
          if ($LASTEXITCODE -ne 0) { throw "npm install ist fehlgeschlagen." }

      - name: Assemble and test legacy Touch-Deck Pro package
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Legacy Touch-Deck-Pro- oder Integrationstests sind fehlgeschlagen." }
          foreach ($required in @(
            "src/renderer/touch-deck-pro-v2.js",
            "src/renderer/touch-deck-pro-v2.css",
            "src/renderer/index.html"
          )) {
            if (-not (Test-Path $required)) { throw "Vorbereitete Legacy-Touch-Deck-Pro-Datei fehlt: $required" }
          }

      - name: Build legacy Windows x64 installer
        shell: pwsh
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          npm_config_ignore_scripts: "false"
        run: |
          $ErrorActionPreference = "Stop"
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw "Legacy-Windows-Installer konnte nicht gebaut werden." }

      - name: Upload legacy package
        uses: actions/upload-artifact@v4
        with:
          name: Batto-OBS-Tool-Legacy-TouchDeck-Pro-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
